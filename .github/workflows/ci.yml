name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only needs to read the repository
permissions:
  contents: read

# If you push again while a run is in progress, cancel the old run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A real PostgreSQL, started as a container next to the job
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: discoclub
          POSTGRES_PASSWORD: discoclub
          POSTGRES_DB: discoclub
        ports:
          - 5432:5432
        # The job only starts once PostgreSQL accepts connections
        options: >-
          --health-cmd "pg_isready -U discoclub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test